name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  # Adds a "Run workflow" button on the Actions tab, so a run can be started
  # without pushing anything.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # The pipeline shells out to ffmpeg and ffprobe. Without them the
      # integration tests skip themselves and the suite passes without ever
      # having cut a file.
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: uv sync --frozen

      - name: ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: pyright
        run: uv run pyright

      # If these are missing the integration tests skip themselves and the
      # suite still goes green, so fail here instead of passing quietly.
      - name: verify ffmpeg is usable
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # -ra lists the reason for any skip, so a silently disabled test is
      # visible in the log rather than hidden in the pass count.
      - name: pytest
        run: uv run pytest -q -ra --cov --cov-report=term-missing

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
