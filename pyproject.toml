[project]
name = "chaptercut"
version = "0.1.0"
description = "Telegram bot that turns YouTube links into chapter-split, fully tagged MP3s or downloaded videos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiogram>=3.15,<4",
    "aiohttp>=3.14.3",
    "aiosqlite>=0.20",
    "mutagen>=1.47",
    "pillow>=10.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "unidecode>=1.3",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
chaptercut = "chaptercut.main:run"

[dependency-groups]
# The file server deploys on its own; the bot never imports it.
fileserver = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    { include-group = "fileserver" },
    "httpx>=0.27",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chaptercut", "src/filexchange"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101",     # assert: used throughout the test suite
    "ASYNC109", # timeout parameters are forwarded to the subprocess wrappers on purpose
    "ASYNC240", # stat/mkdir on a local path is not worth an anyio dependency
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ffmpeg: requires a working ffmpeg/ffprobe on PATH",
]

[tool.coverage.run]
source = ["src/chaptercut"]
